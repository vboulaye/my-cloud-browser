name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - uses: actions/configure-pages@v6
        id: pages
      - name: Write public app config
        shell: bash
        env:
          PUBLIC_MICROSOFT_CLIENT_ID: ${{ vars.PUBLIC_MICROSOFT_CLIENT_ID }}
          PUBLIC_MICROSOFT_REDIRECT_URI: ${{ vars.PUBLIC_MICROSOFT_REDIRECT_URI }}
        run: |
          {
            printf 'PUBLIC_MICROSOFT_CLIENT_ID=%s\n' "$PUBLIC_MICROSOFT_CLIENT_ID"
            printf 'PUBLIC_MICROSOFT_REDIRECT_URI=%s\n' "$PUBLIC_MICROSOFT_REDIRECT_URI"
          } > .env
      - name: Build static site
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/
          include-hidden-files: true

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
